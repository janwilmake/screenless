<!doctype html>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;box-sizing:border-box}
  html,body{width:1200px;height:630px}
  body{background:#0c0e14;color:#fff;font-family:"Inter",sans-serif;
       position:relative;overflow:hidden;
       background-image:radial-gradient(900px 500px at 100% 120%, rgba(194,58,31,.28), transparent 60%),
                        radial-gradient(700px 400px at -10% -20%, rgba(255,255,255,.05), transparent 60%);}
  .pad{position:absolute;inset:0;padding:66px 72px;display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:13px}
  .brand svg{height:38px}
  .brand span{font-size:30px;font-weight:700;letter-spacing:-.02em}
  h1{margin-top:auto;font-size:82px;font-weight:800;letter-spacing:-.04em;line-height:1.02;max-width:17ch}
  h1 .r{color:#f0876a}
  .row{display:flex;align-items:center;justify-content:space-between;margin-top:36px}
  .call{display:inline-flex;align-items:center;gap:12px;background:#12151d;
        border:1px solid #23283400;border:1px solid #23262f;border-radius:12px;
        padding:13px 18px;font-family:"JetBrains Mono",monospace;font-size:19px;color:#c9cedb}
  .call .dot{width:11px;height:11px;border-radius:50%;background:#f0876a;
             box-shadow:0 0 0 0 rgba(240,135,106,.6);animation:none}
  .call b{color:#fff;font-weight:500}
  .tag{font-size:20px;color:#8b93a7}
</style>
<body>
<div class="pad">
  <div class="brand">
    <svg viewBox="16 1 68 112" aria-hidden="true"><path d="M 70.4 43.2 A 22 22 0 1 0 50 57 A 22 22 0 1 1 29.6 70.8" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/><circle cx="50" cy="35" r="7.5" fill="#f0876a"/><circle cx="50" cy="79" r="7.5" fill="#f0876a"/></svg>
    <span>screenless</span>
  </div>
  <h1>Your agents get stuck.<br>Let them <span class="r">call you.</span></h1>
  <div class="row">
    <div class="call"><span class="dot"></span><span>☎ <b>ringing you</b> — legacy price rows: drop or migrate?</span></div>
    <div class="tag">screenless.sh</div>
  </div>
</div>
</body>
